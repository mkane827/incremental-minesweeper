@let c = cell();

@if (c.state === 'flagged') {
  <mat-icon class="glyph flag">flag</mat-icon>
  @if (c.wrongFlag) {
    <mat-icon class="glyph strike">close</mat-icon>
  }
} @else if (c.state === 'hidden' && c.hasSniffer) {
  <span class="glyph sniffer">🐶</span>
} @else if (c.state === 'revealed' && c.isMine) {
  <svg class="glyph mine" viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M11 1.5h2v3.2h-2zM11 19.3h2v3.2h-2zM1.5 11h3.2v2H1.5zM19.3 11h3.2v2h-3.2zM4.4 5.8 5.8 4.4l2.3 2.3-1.4 1.4zM15.9 17.3l1.4-1.4 2.3 2.3-1.4 1.4zM5.8 19.6l-1.4-1.4 2.3-2.3 1.4 1.4zM17.3 8.1l-1.4-1.4 2.3-2.3 1.4 1.4z"
    />
    <circle cx="12" cy="12" r="5.4" />
    <circle class="shine" cx="10" cy="10" r="1.3" />
  </svg>
} @else if (c.state === 'revealed' && c.adjacentMines > 0) {
  <span class="glyph count">{{ c.adjacentMines }}</span>
}

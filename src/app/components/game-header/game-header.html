<div class="header">
  <div class="readout" aria-label="Mines remaining">
    <mat-icon class="readout-icon" aria-hidden="true">flag</mat-icon>
    <span class="digits">{{ mineText() }}</span>
  </div>

  @if (upgrades.snifferUnlocked()) {
    <div class="readout" aria-label="Next sniffer activation in seconds">
      <span class="sniffer-icon" aria-hidden="true">🐶</span>
      <span class="digits" [class.is-hidden]="secondsUntilSniff() === 0">
        {{ snifferText() }}
      </span>
    </div>
  }

  @if (upgrades.autoFlagUnlocked()) {
    <div class="readout" aria-label="Next auto-flag attempt in seconds">
      <span class="auto-flag-icon" aria-hidden="true">🚩</span>
      <span class="digits" [class.is-hidden]="secondsUntilAutoFlag() === 0">
        {{ autoFlagText() }}
      </span>
    </div>
  }

  @if (upgrades.autoChordUnlocked()) {
    <div class="readout" aria-label="Next auto-chord attempt in seconds">
      <span class="auto-chord-icon" aria-hidden="true">🤖</span>
      <span class="digits" [class.is-hidden]="secondsUntilAutoChord() === 0">
        {{ autoChordText() }}
      </span>
    </div>
  }

  @if (upgrades.autoRestartUnlocked()) {
    <div class="readout" aria-label="Automatic restart in seconds">
      <span class="auto-restart-icon" aria-hidden="true">🔁</span>
      <span class="digits" [class.is-hidden]="status() !== 'won' && status() !== 'lost'">
        {{ autoRestartText() }}
      </span>
    </div>
  }

  <button
    matIconButton
    class="face"
    type="button"
    matTooltip="New game"
    aria-label="Start a new game"
    (click)="reset()"
  >
    <mat-icon>{{ faceIcon() }}</mat-icon>
  </button>

  <div class="readout" aria-label="Elapsed time">
    <mat-icon class="readout-icon" aria-hidden="true">timer</mat-icon>
    <span class="digits">{{ elapsed() }}</span>
  </div>
</div>

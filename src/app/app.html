<mat-toolbar class="app-bar">
  <mat-icon class="app-bar-icon" aria-hidden="true">grid_on</mat-icon>
  <span class="app-bar-title">Incremental Minesweeper</span>
  <span class="app-bar-spacer"></span>
  <div class="currency" aria-label="Mines banked">
    <mat-icon aria-hidden="true">diamond</mat-icon>
    <span>{{ currency.mines() }}</span>
  </div>
  <div class="currency" aria-label="Prestige points">
    <mat-icon aria-hidden="true">auto_awesome</mat-icon>
    <span>{{ prestige.points() }}</span>
  </div>
  <button
    matIconButton
    type="button"
    matTooltip="Prestige"
    aria-label="Open the prestige menu"
    (click)="openPrestige()"
  >
    <mat-icon>auto_awesome</mat-icon>
  </button>
  <button
    matIconButton
    type="button"
    matTooltip="Upgrades"
    aria-label="Open the upgrades menu"
    (click)="openUpgrades()"
  >
    <mat-icon>upgrade</mat-icon>
  </button>
  <button
    matIconButton
    type="button"
    matTooltip="Keyboard shortcuts"
    aria-label="Open keyboard shortcut settings"
    (click)="openSettings()"
  >
    <mat-icon>settings</mat-icon>
  </button>
</mat-toolbar>

<main class="page">
  <div class="game-container">
    <ms-game-header />

    <div class="board-scroll">
      <ms-board />
    </div>

    @if (banner(); as info) {
      <button
        type="button"
        class="banner"
        [class.is-lost]="status() === 'lost'"
        aria-live="polite"
        (click)="reset()"
      >
        <mat-icon aria-hidden="true">{{ info.icon }}</mat-icon>
        <span>{{ info.text }}</span>
      </button>
    }
  </div>

  <p class="hint">
    Left click to reveal &middot; right click to flag &middot; click a number with all its
    mines flagged to clear around it.
  </p>
  <p class="hint">{{ keyHint() }}</p>
</main>
